<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Estimate prospects, leads, and customers for your campaign with LeadPredictor.">
    <title>LeadPredictor &mdash; Campaign Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="customers.js" defer></script>
    <script src="leads.js" defer></script>
    <script src="prospects.js" defer></script>
    <script src="graph.js" defer></script>
  </head>
  <body>
    <main class="calculator">
      <header class="calculator__header">
        <h1><svg class="brand-icon" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="5"/><path d="M5 6h18v4l-7 8v6l-5 3V18l-6-8z"/></svg><span><strong>Lead</strong>Predictor</span></h1>
        <p class="visually-hidden">Plan your campaign and estimate your sales funnel.</p>
      </header>

      <form id="campaign-form" class="calculator__form">
        <section class="campaign-settings" aria-labelledby="settings-heading">
          <h2 id="settings-heading" class="visually-hidden">Campaign settings</h2>

          <div class="form-field">
            <label for="language">Language</label>
            <div class="select-control language-control">
            <select id="language" name="language">
              <option value="en" selected>English</option>
            </select>
            </div>
          </div>

          <div class="form-field">
            <label for="currency">Currency</label>
            <div class="select-control">
            <select id="currency" name="currency">
              <option value="USD" selected>$ US Dollar</option>
            </select>
            </div>
          </div>

          <div class="form-field">
            <label for="campaign-start">Campaign Start</label>
            <input type="date" id="campaign-start" name="campaignStart" value="2026-05-08" required>
          </div>

          <div class="form-field">
            <label for="campaign-end">Campaign End</label>
            <input type="date" id="campaign-end" name="campaignEnd" value="2026-11-04" required>
          </div>

          <div class="form-field">
            <label for="total-revenue">Total Revenue <span class="visually-hidden">(USD)</span></label>
            <div class="money-control">
            <input type="number" id="total-revenue" name="totalRevenue" min="0" step="0.01" value="10000" required>
            </div>
          </div>

          <div class="form-field">
            <label for="average-order-value">Avg. Order Value <span class="visually-hidden">(USD)</span></label>
            <div class="money-control">
            <input type="number" id="average-order-value" name="averageOrderValue" min="0.01" step="0.01" value="1000" required>
            </div>
          </div>
        </section>

        <section class="response-rates" aria-labelledby="rates-heading">
          <h2 id="rates-heading" class="visually-hidden">Response rates</h2>

          <div class="form-field">
            <label for="lead-response-rate">Lead Response Rate</label>
            <input type="range" id="lead-response-rate" name="leadResponseRate" min="0" max="100" step="1" value="40" aria-describedby="lead-response-unit">
            <span id="lead-response-unit" class="visually-hidden">Percent</span>
            <output id="lead-response-value" for="lead-response-rate">40.00%</output>
          </div>

          <div class="form-field">
            <label for="prospect-response-rate">Prospect Response Rate</label>
            <input type="range" id="prospect-response-rate" name="prospectResponseRate" min="0" max="100" step="1" value="20" aria-describedby="prospect-response-unit">
            <span id="prospect-response-unit" class="visually-hidden">Percent</span>
            <output id="prospect-response-value" for="prospect-response-rate">20.00%</output>
          </div>
        </section>
      </form>

      <section class="campaign-results" aria-labelledby="results-heading">
        <h2 id="results-heading" class="visually-hidden">Campaign forecast</h2>
        <p class="visually-hidden">Campaign forecast</p>

        <figure class="campaign-chart" aria-labelledby="chart-caption">
          <div id="campaign-chart" class="campaign-chart__plot">
            <svg id="campaign-chart-svg" class="funnel-chart" viewBox="0 0 398 306" role="group" aria-labelledby="chart-title chart-description" hidden></svg>
            <p id="campaign-chart-status" class="chart-status" role="status">Enable JavaScript to view the campaign forecast.</p>
            <div id="campaign-chart-tooltip" class="chart-tooltip" role="tooltip" hidden></div>
          </div>
          <figcaption id="chart-caption" class="visually-hidden">Sales funnel by month</figcaption>
        </figure>

        <div class="forecast-summary">
          <section class="summary-card summary-card--prospects" aria-labelledby="prospects-heading">
            <h3 id="prospects-heading"><svg class="summary-card__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6l2 2h8v3H4zM3 12h18l-2 7H4z"/></svg>Prospects</h3>
            <p class="summary-card__count" id="prospects-count" aria-live="polite" aria-atomic="true">125</p>
            <p class="summary-card__percentage" id="prospects-percentage">100%</p>
            <meter id="prospects-meter" min="0" max="100" value="100" aria-label="Prospects as a percentage of total prospects">100%</meter>
          </section>

          <section class="summary-card summary-card--leads" aria-labelledby="leads-heading">
            <h3 id="leads-heading"><svg class="summary-card__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M6 19v-3c0-5 12-5 12 0v3z"/></svg>Leads</h3>
            <p class="summary-card__count" id="leads-count" aria-live="polite" aria-atomic="true">25</p>
            <p class="summary-card__percentage" id="leads-percentage">20%</p>
            <meter id="leads-meter" min="0" max="100" value="20" aria-label="Leads as a percentage of total prospects">20%</meter>
          </section>

          <section class="summary-card summary-card--customers" aria-labelledby="customers-heading">
            <h3 id="customers-heading"><svg class="summary-card__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v7c0 3-2 4-3 4v3h4v3H7v-3h4v-3c-2-1-3-2-3-4zM7 6H3v4c0 3 3 4 5 4v-2c-2 0-3-1-3-3V8h2zM17 6h4v4c0 3-3 4-5 4v-2c2 0 3-1 3-3V8h-2z"/></svg>Customers</h3>
            <p class="summary-card__count" id="customers-count" aria-live="polite" aria-atomic="true">10</p>
            <p class="summary-card__percentage" id="customers-percentage">8%</p>
            <meter id="customers-meter" min="0" max="100" value="8" aria-label="Customers as a percentage of total prospects">8%</meter>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
